version: 2

models:
  - name: fct_orders_reviews
    description: "Fact table that joins orders with reviews. Metrics are aggregated at the order-review level."
    columns:
      - name: month_end_date
        data_type: date
        description: "Date representing the end of the month for aggregation."

      - name: review_score_desc
        data_type: string
        description: "Description of the review score."
      - name: delivery_status
        data_type: string
        description: "Status of the delivery."

      - name: number_of_orders
        data_type: int64
        description: "Total number of orders."

      - name: avg_review_score
        data_type: float64
        description: "Average review score."

  - name: fct_state_distribution
    description: "Fact table that aggregates order data by state."
    columns:
      - name: month_end_date
        data_type: date
        description: "Date representing the end of the month for aggregation."

      - name: state
        data_type: string
        description: "State of the customer."

      - name: iso_code
        data_type: string
        description: "ISO code of the state."

      - name: number_of_orders
        data_type: int64
        description: "Total number of orders."

      - name: median_delivery_days
        data_type: int64
        description: "Median delivery days."